[package]
name = "photos"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-photos = { workspace = true, features = ["block2", "dispatch2", "objc2-app-kit", "objc2-av-foundation", "objc2-core-foundation", "objc2-uniform-type-identifiers"] }
objc2-av-foundation = { workspace = true, features = ["block2", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media.workspace = true
objc2-app-kit = { workspace = true, default-features = false, features = ["std", "NSImage", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-image-io.workspace = true
objc2-uniform-type-identifiers.workspace = true
block2.workspace = true
dispatch2.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
clap.workspace = true

# Runs its own main() on the process main thread (the fetch pools require it) and raises signals.
[[test]]
name = "stop_signal"
harness = false
