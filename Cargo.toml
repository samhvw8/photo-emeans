[workspace]
resolver = "3"
members = ["crates/photos", "crates/photo-emeans"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samhvw8/photo-emeans"
publish = false

[workspace.dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
candle-metal-kernels = "0.11.1"
candle-flash-attn = "0.11.1"
tokenizers = "0.23.2"
safetensors = "0.8.0"
hf-hub = "1.0.0"
image = "0.25.10"
clap = { version = "4.6.7", features = ["derive"] }
memmap2 = "0.9.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
rayon = "1.12.0"
half = "2.7.1"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-photos = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-image-io = "0.3.2"
objc2-metal = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-media = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-uniform-type-identifiers = "0.3.2"
# The libraries live in their own repos, pinned by commit.
emeans = { git = "https://github.com/samhvw8/emeans", rev = "2e7233b15bc22bb5c8af080fdfca9ffb64622cad" }
encoder = { package = "candle-embeddings", git = "https://github.com/samhvw8/candle-embeddings", rev = "65f8a8c39df3e07471514b570884f0161d9e364c" }
photos = { path = "crates/photos" }

[profile.release]
debug = 1
